<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gla 债券市场跟踪</title>
<link rel="stylesheet" href="assets/css/terminal.css">
</head>
<body>

<aside class="sidebar">
  <div class="brand">gla 债券市场跟踪<small>本地周报级跟踪 · 零 CDN</small></div>
  <nav id="nav" class="nav"><!-- App.init 注入全部面板 .menu-link + 生成报告菜单 --></nav>
  <div class="sidebar-foot" id="sidebar-foot"><!-- 数据更新于 {DATA.meta.asOf} --></div>
</aside>

<!-- 启动占位：核心 data.js（约 1.5MB；利差/行业/流动性/机构/品种五大模块已拆分按需加载）
     下载完前页面空白，易被误认为打不开；App.show 渲染前会 root.innerHTML=""，
     此节点加载完成后自动消失，无需 JS 清理 -->
<main id="panel-root" class="main">
  <div id="boot" style="max-width:620px;margin:48px 32px;padding:20px 24px;border:1px solid #26344a;border-radius:8px;color:#8fa3bd;font-size:14px;line-height:2">
    <b style="color:#c8d6e5">正在加载数据包…</b><br>
    核心数据约 1.5MB；利差 / 行业 / 流动性 / 机构 / 品种等大模块进入对应面板时再按需加载（首次约数秒到数十秒）；加载完成后自动进入看板，二次访问有本地缓存会明显变快。
  </div>
</main>

<!-- 依序：数据 → 图表库 → 图表封装 → 导出 → 各面板注册 → 应用路由 -->
<script src="assets/data/data.js?v=2026-09-25.0853"></script>
<script src="assets/js/echarts.min.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/export.js"></script>
<script>
/* ============================================================
   panels/home.js — 首页 · 策略总览（Task 10）
   结构：市场锚点行 → 多空对照 + 综合研判（2 列）→ 六板块摘要（2×3）
   消费：App.h / App.fmt / App.badge / App.show（Task 8）、
         Charts.line / barDiverge / heat（Task 9）、DATA.home + 各板块摘要
   语义色（terminal.css）：收益率下行 = 利多 = 绿（.down）、
         上行 = 利空 = 红（.up）；箭头方向 = 收益率变动方向（▼/▲）
   空数据：各区块独立防御，锚点/因素/研判/摘要任一缺失渲染 .empty 不抛异常
   ============================================================ */

/* 回购定盘利率类序列（锚点卡底部标注口径用） */
const _HOME_FIXING_KEYS = new Set(["FDR001", "FDR007", "FDR014", "FR001", "FR007", "FR014"]);

PANELS["home"] = {
  title: "首页",
  icon: "🏠",

  render(root) {
    const D = (typeof DATA !== "undefined" && DATA) || {};
    const brief = (D.home && D.home.brief) || {};
    const factors = Array.isArray(brief.factors) ? brief.factors : [];
    const view = brief.view || {};
    const modules = (D.meta && D.meta.modules) || {};
    const modBadge = (mod, fallback) =>
      App.badge((modules[mod] && modules[mod].source) || fallback, modules[mod] && modules[mod].fetchedAt);

    /* —— 1. 市场锚点行：大数字 + 周变动（bp，带符号与方向箭头）+ 实际口径 —— */
    const anchors = (Array.isArray(D.home && D.home.anchors) ? D.home.anchors : []);
    const chgSpan = (v) => {
      if (v === null || v === undefined) return h("span", {class: "flat"}, ["周 —"]);
      const cls = v > 0 ? "up" : v < 0 ? "down" : "flat";
      const arrow = v > 0 ? "▲" : v < 0 ? "▼" : "";
      return h("span", {class: cls},
        ["周 ", arrow ? arrow + " " : "", v > 0 ? "+" : "", App.fmt(v, 1), " bp"]);
    };
    // 收益率行 as-of：优先锚点源（日频）自身末日 yieldsAsOf；全局 meta.asOf 混入
    // 周度 W-SUN 标签（未来周日）时不得跟着显示未来日期
    const asOf = (D.home && D.home.yieldsAsOf) || (D.meta && D.meta.asOf) || "";
    const AB = (D.home && D.home.activeBonds) || {};   // J 活跃券：财汇要素表最新上市2只
    const abLine = (key) => {
      const t = key === "国债10Y" ? AB["10Y"] : key === "国债30Y" ? AB["30Y"] : null;
      if (!Array.isArray(t) || !t.length) return null;
      return h("div", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "2px",
        whiteSpace: "nowrap"}},
        ["活跃 " + t[0].code + (t.length > 1 ? " · 次新 " + t[1].code : "")]);
    };
    const anchorsCard = h("section", {class: "card"}, [
      anchors.length
        ? [asOf ? h("div", {style: {fontSize: "12px", color: "var(--muted)", marginBottom: "6px"}},
            ["收益率截至 " + asOf + "（周变动 bp）"]) : null,
           h("div", {class: "anchor-row"}, anchors.map(a => h("div", {class: "anchor"}, [
            h("div", {class: "anchor-label"}, [(a && a.key) || "—"]),
            h("div", {class: "anchor-value"}, [App.fmt(a && a.value, 2)]),
            h("div", {class: "anchor-chg"}, [chgSpan(a && a.wowBp)]),
            (a && (a.key === "国债10Y" || a.key === "国债30Y")) ? abLine(a.key) : null,
            (a && a.seriesKey)
              ? h("div", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "2px"}},
                  ["口径 " + a.seriesKey + (_HOME_FIXING_KEYS.has(a.seriesKey) ? "（定盘）" : "")])
              : null,
          ])))]
        : h("div", {class: "empty"}, ["暂无锚点数据"]),
    ]);

    /* —— 2a. 多空因素对照：方向色 + 强度 1-5 格 + 持续性；行点击跳转对应面板 —— */
    const factorRow = (f) => {
      f = f || {};
      const dir = f.direction;
      const dirCell = dir === "bull"
        ? h("span", {style: {color: "var(--success)", fontWeight: 600, whiteSpace: "nowrap"}}, ["🟢 利多"])
        : dir === "bear"
          ? h("span", {style: {color: "var(--danger)", fontWeight: 600, whiteSpace: "nowrap"}}, ["🔴 利空"])
          : h("span", {class: "flat"}, ["—"]);
      const hasStrength = Number.isFinite(Number(f.strength)) && Number(f.strength) > 0;
      const n = Math.max(1, Math.min(5, Math.round(Number(f.strength) || 0)));
      const target = f.panel || f.panels;                 // panel 字段可能缺省（Task 16 LLM 简报定义）
      return h("tr", (target && PANELS[target]) ? {style: {cursor: "pointer"}, onclick: () => App.show(target)} : {}, [
        h("td", {}, [dirCell]),
        h("td", {}, [f.text || "—"]),
        h("td", {style: {whiteSpace: "nowrap", letterSpacing: "1px"}},
          [hasStrength ? "■".repeat(n) + "□".repeat(5 - n) : "—"]),
        h("td", {}, [f.duration || "—"]),
      ]);
    };
    const factorsCard = h("section", {class: "card", id: "factors-card"}, [
      h("h3", {class: "card-title"}, ["多空因素对照"]),
      factors.length
        ? [h("p", {class: "card-sub"}, ["点击因素行跳转对应面板 · 强度 1–5 格"]),
           h("table", {class: "tbl"}, [
             h("thead", {}, [h("tr", {}, ["方向", "因素", "强度", "持续性"].map(x => h("th", {}, [x])))]),
             h("tbody", {}, factors.map(factorRow)),
           ])]
        : h("div", {class: "empty"}, ["策略因素待生成（LLM key 未配置时跳过）/ 可手工维护 brief_override.json"]),
    ]);

    /* —— 2b. 综合研判：三研判徽章 + 可折叠正文；overridden=true 显示“手工版”角标 —— */
    const CLAMP = {display: "-webkit-box", WebkitLineClamp: "3", WebkitBoxOrient: "vertical", overflow: "hidden"};
    const narrative = brief.narrative || "";
    const narBody = h("div", {style: Object.assign({whiteSpace: "pre-line"}, CLAMP)}, [narrative]);
    const expandBtn = h("button", {style: {display: "none", border: "none", background: "none",
      padding: "4px 0", fontSize: "12px", color: "var(--blue)", cursor: "pointer"}}, ["展开全部 ▾"]);
    let expanded = false;
    expandBtn.addEventListener("click", () => {
      expanded = !expanded;
      Object.assign(narBody.style, expanded ? {display: "block", WebkitLineClamp: "", overflow: ""} : CLAMP);
      expandBtn.textContent = expanded ? "收起 ▴" : "展开全部 ▾";
    });
    const viewCard = h("section", {class: "card", id: "view-card"}, [
      h("h3", {class: "card-title"}, ["综合研判"]),
      brief.overridden
        ? h("span", {class: "chip warn", style: {position: "absolute", top: "13px", right: "14px"}}, ["手工版"])
        : (brief.generatedAt ? App.badge("生成时间", brief.generatedAt) : null),
      h("div", {style: {display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "12px"}},
        [["rate", "利率方向"], ["curve", "曲线形态"], ["credit", "信用策略"]].map(([k, label]) =>
          h("span", {class: "chip"}, [label + "：" + (view[k] || "—")]))),
      narrative
        ? h("div", {}, [narBody, expandBtn])
        : h("div", {class: "empty"}, ["策略研判待生成（Task 16 LLM 接入后可用）/ 可手工维护 brief_override.json"]),
    ]);

    /* —— 3. 六板块摘要小图（300px 级卡片，点击跳转对应面板）—— */
    const rs = ((D.homesupp && D.homesupp.liquidity && D.homesupp.liquidity.rateSeries)
      || (D.liquidity && D.liquidity.rateSeries)) || {};   // 摘要块优先，回退整块
    const rateKey = rs.DR007 ? "DR007" : rs.FDR007 ? "FDR007" : rs.FR007 ? "FR007" : null;   // 成交口径优先，定盘次之
    const ratePick = rateKey ? rs[rateKey] : null;
    const ws = (D.fiscal && D.fiscal.weeklySupply) || {};
    const hd = (D.homesupp && D.homesupp.institution) || {};   // 首页摘要块，回退整块
    const du = hd.duration || (D.institution && D.institution.duration) || {};
    const we = hd.wealth || (D.institution && D.institution.wealth) || {};
    const nb = hd.netbuyMatrix || (D.institution && D.institution.netbuyMatrix) || {};
    const pmi = ((D.fundamentals && D.fundamentals.macroTable) || [])
      .find(r => /PMI/.test((r && r.key) || "") || /PMI/.test((r && r.name) || "")) || null;

    const sumDefs = [
      { title: "资金价格" + (rateKey ? "（" + rateKey + "）" : ""), panel: "liquidity", mod: "liquidity", src: "流动性",
        height: 220,
        draw: el => Charts.line(el, {yUnit: "%", range: "1Y", series: ratePick
          ? [{name: rateKey, dates: ratePick.dates || [], values: ratePick.values || []}] : []}) },
      { title: "政府债净供给", panel: "fiscal", mod: "fiscal", src: "财政",
        height: 220,
        draw: el => Charts.barDiverge(el, {dates: ws.dates || [], values: ws.net || [], yUnit: "亿元"}) },
      { title: "债基久期（利率型）", panel: "institution", mod: "institution", src: "机构",
        height: 220,
        draw: el => Charts.line(el, {yUnit: "年", series: [{name: "利率型中位数",
          dates: du.dates || [], values: du["利率型中位数"] || []}]}) },
      { title: "理财规模（总量）", panel: "institution", mod: "institution", src: "机构",
        height: 220,
        draw: el => Charts.line(el, {yUnit: "万亿元", series: [{name: "理财规模",
          dates: we.dates || [], values: we.total || []}]}) },
      { title: "净买入热力（" + (nb.block || "全部") + "）", panel: "institution", mod: "institution", src: "机构",
        height: null,                                    // DOM 热力图随内容自适应高度
        draw: el => Charts.heat(el, {rows: nb.institutions || [], cols: nb.tenors || [], values: nb.values || [],
          title: "净买入（亿元）", fmt: v => App.fmt(v, 0)}) },
      { title: (pmi && pmi.key) || "PMI", panel: "fundamentals", mod: "macro", src: "宏观",
        height: 220,
        draw: el => Charts.line(el, {yUnit: (pmi && pmi.unit) || "%", range: "1Y", series: pmi
          ? [{name: pmi.key, dates: (pmi.dates || []).slice(-12), values: (pmi.values || []).slice(-12)}] : []}) },
    ];
    const sumCards = sumDefs.map(def => {
      const box = h("div", {style: def.height ? {height: def.height + "px"} : null,
        onclick: e => e.stopPropagation()});             // 图表交互（range 切换条等）不冒泡触发跳转
      const card = h("section", {class: "card sum-card", style: {cursor: "pointer"},
        title: "点击查看「" + (PANELS[def.panel] ? PANELS[def.panel].title : def.panel) + "」面板",
        onclick: () => App.show(def.panel)}, [
        h("h3", {class: "card-title"}, [def.title]),
        modBadge(def.mod, def.src),
        box,
      ]);
      return {card, box, def};
    });

    /* —— 4. FICC 五驱动研判区（ficc-bond-strategy skill 方法论，DATA.ficc.rates）—— */
    /* 事件时钟主体由数据链日更（DATA.ficc.events：资金面日历/买断排期/规则季节性/LLM 议息·带核查），
       此数组仅作人工补充（src 默认"人工"，绿色徽标）；与自动条目同日同 note 前 20 字会去重 */
    const FICC_EVENTS = [
      /* 示例：{date: "2026-10-20", tag: "政策会议", note: "……"}, */
    ];
    function cardFive() {
      const FR = D.ficc || {};
      const R = FR.rates || null;
      const fq = FR.quant || null;
      if (!R || !R.curve || !R.curve["国债10Y"]) return null;
      const fund = R.fundamentals || {};
      const ins = R.institutions || {};
      const num = (x, nd) => (x == null ? "—" : Number(x).toFixed(nd == null ? 2 : nd));
      const y10 = R.curve["国债10Y"].level;
      const pct10 = R.curve["国债10Y"].pct2017;
      const gap20 = R.dr_omo_gap_ma20;
      const fundNet20 = ins.fund_cdb_net20d;

      /* 打分推导（移植 demo 案例逻辑：数据驱动 + 定性标注） */
      const cpi = fund["CPI同比"] || {}, ppi = fund["PPI同比"] || {}, m2 = fund["M2同比"] || {};
      const lev = ins["银行间杠杆率"] || {}, dis = ins["分歧度_利率"] || {};
      const ra = R.risk_appetite || {};
      const drv = [
        {name: "基本面", dire: ((ppi.latest || 0) < 0.5 ? "偏多" : "中性偏空"), strength: "中", conf: "中",
         evid: "CPI " + num(cpi.latest, 1) + "% / PPI " + num(ppi.latest, 1) + "% / M2 " + num(m2.latest, 1) + "%"
           + (fund["制造业PMI"] ? " / PMI " + num(fund["制造业PMI"].latest, 1) : ""),
         gap: "PMI分项、地产投资、社融未接入；低通胀定价充分"},
        /* gap20/tiering 在 storage 中为 % 单位（同 dr007/omo7d 口径），展示与阈值统一 ×100 折算 bp */
        {name: "资金面", dire: (gap20 == null ? "中性" : (gap20 * 100 < -5 ? "偏松" : gap20 * 100 > 5 ? "偏紧" : "中性")),
         strength: (gap20 != null && Math.abs(gap20 * 100) > 15 ? "强" : "中"), conf: "高",
         evid: "DR007 " + num(R.dr007_last) + "% vs OMO " + num(R.omo7d) + "%，20日均值偏离 "
           + num(gap20 == null ? null : gap20 * 100, 1) + "bp，分层 "
           + num(R.tiering == null ? null : R.tiering * 100, 1) + "bp",
         gap: "票据利率、NCD一级未接入；±5bp 内视为中性（贴近政策利率不算紧）"},
        {name: "政府债供给", dire: "中性偏空(季节)", strength: "中", conf: "低",
         evid: "季末/年末额度冲刺供给放量（定性）",
         gap: "发行/净融资/缴款日历未接入 → 以事件时钟定性处理"},
        {name: "机构行为", dire: ((fundNet20 || 0) > 0 ? "偏多(追涨)" : "偏空(赎回压力)"), strength: "中", conf: "中",
         evid: "基金政金债净买入20日 " + num(fundNet20, 0) + "亿；银行间杠杆率 " + num(lev.latest)
           + "(" + num((lev.pct || 0) * 100, 0) + "%分位)；分歧度 " + num(dis.latest),
         gap: "理财/农商行行为周频未展开"},
        {name: "风险偏好", dire: "中性", strength: "中", conf: "中",
         evid: "红利股息率-国债10Y " + num(ra.equity_bond_spread) + "pct（股息性价比）",
         gap: "两融/商品波动率/A股情绪未接入"},
      ];
      const dirColor = t => t.indexOf("偏多") >= 0 || t.indexOf("偏松") >= 0 ? "#1f8a5f"
        : t.indexOf("偏空") >= 0 || t.indexOf("偏紧") >= 0 ? "#c24135" : "#8a8f98";

      /* 打分表 */
      const tdd = (t, right, color) => h("td", {style: {padding: "3px 10px",
        textAlign: right ? "right" : "left", fontSize: "12px",
        color: color || null, fontVariantNumeric: "tabular-nums",
        whiteSpace: t.length > 18 ? "normal" : "nowrap"}}, [t]);
      const drvRows = drv.map(d => h("tr", {}, [
        tdd(d.name),
        tdd(d.dire, 0, dirColor(d.dire)),
        tdd(d.strength, 1), tdd(d.conf, 1),
        tdd(d.evid), tdd(d.gap),
      ]));
      const drvTable = h("table", {style: {borderCollapse: "collapse", width: "100%"}}, [
        h("thead", {}, [h("tr", {style: {color: "var(--muted)", fontSize: "11px"}}, [
          tdd("驱动"), tdd("方向"), tdd("强度", 1), tdd("置信", 1), tdd("证据（数据）"), tdd("缺口"),
        ])]),
        h("tbody", {}, drvRows),
      ]);

      /* 一句话结论（数据驱动） */
      const nBull = drv.filter(d => d.dire.indexOf("偏多") >= 0 || d.dire.indexOf("偏松") >= 0).length;
      const nBear = drv.filter(d => d.dire.indexOf("偏空") >= 0 || d.dire.indexOf("偏紧") >= 0).length;
      const stance = nBull > nBear ? "中性偏多" : nBull < nBear ? "中性偏空" : "中性";
      const msig = (D.quant && D.quant.bondSignal && D.quant.bondSignal.latest) || null;
      const concl = (R.as_of || "") + " 五驱动：" + nBull + " 多 / " + nBear + " 空 / " + (drv.length - nBull - nBear)
        + " 中性 → 综合「" + stance + "」；10Y " + num(y10) + "%（2017 以来 " + num((pct10 || 0) * 100, 0)
        + "% 分位）"
        + (msig ? "；马尔可夫 " + msig.signal : "")
        + (fq && fq.latest ? "；因子模型测算下月利率上行概率 " + (Number(fq.latest.p_median) * 100).toFixed(0) + "%" : "")
        + "。规则化打分，与右侧 LLM 多空研判互补（含定性信息）。";

      /* 三情景（区间随 y10 动态；幅度为相对变动 ±5%/-12%/+10%，折算为收益率水平区间） */
      const scen = [
        {tag: "中性(基准)", prob: "55%", range: num(y10 * 0.95) + "%~" + num(y10 * 1.05) + "%", cls: "#8a8f98",
         trig: "资金面维持 OMO 下方窄幅波动，基本面无增量信息，供给节奏平稳",
         act: "久期中性(3~4)，曲线+信用品种 carry 为主", inv: "DR007 持续高于 OMO 20bp"},
        {tag: "偏多", prob: "25%", range: num(y10 * 0.88) + "% 下方", cls: "#1f8a5f",
         trig: "跨季后资金显著转松(DR007-OMO<-20bp) 或 基本面低于预期 或 风险偏好回落",
         act: "久期拉至 5+，10Y/30Y 博弈", inv: "资金中枢重回 OMO 上方"},
        {tag: "偏空", prob: "20%", range: num(y10 * 1.10) + "% 上方", cls: "#c24135",
         trig: "供给放量叠加赎回反馈(基金净买入转负) 或 风险偏好持续回升",
         act: "久期降至 2~3，防赎回负反馈", inv: "供给节奏低于计划/央行对冲加码"},
      ];
      const scenCards = scen.map(x => h("div", {style: {border: "1px solid var(--border, #e3e5e8)",
        borderLeft: "3px solid " + x.cls, borderRadius: "6px", padding: "8px 10px", flex: "1 1 240px",
        background: "var(--card, #fff)", fontSize: "12px", lineHeight: 1.7}}, [
        h("div", {style: {fontWeight: 700, color: x.cls}},
          [x.tag + " · 概率 " + x.prob + " · 10Y 区间 " + x.range]),
        h("div", {style: {color: "var(--muted)"}}, [
          h("b", {}, ["触发："]), x.trig, h("br"),
          h("b", {}, ["动作："]), x.act, h("br"),
          h("b", {}, ["失效："]), x.inv]),
      ]));

      /* 曲线 11 档证据表 */
      const ckeys = ["国债1Y", "国债3Y", "国债5Y", "国债7Y", "国债10Y", "国债30Y",
                     "国开1Y", "国开3Y", "国开5Y", "国开7Y", "国开10Y"];
      const cRows = ckeys.filter(k => R.curve[k]).map(k => {
        const c = R.curve[k];
        return h("tr", {}, [
          tdd(k),
          tdd(num(c.level), 1),
          tdd(c.chg20d_bp == null ? "—" : (c.chg20d_bp > 0 ? "+" : "") + num(c.chg20d_bp, 1), 1,
              c.chg20d_bp == null ? null : (c.chg20d_bp > 0 ? "#c24135" : "#1f8a5f")),
          tdd(num((c.pct2017 || 0) * 100, 0) + "%", 1,
              (c.pct2017 || 0) >= 0.8 ? "#c24135" : (c.pct2017 || 0) <= 0.2 ? "#1f8a5f" : null),
          tdd(c.as_of || "—", 1),
        ]);
      });
      const curveTable = h("table", {style: {borderCollapse: "collapse"}}, [
        h("thead", {}, [h("tr", {style: {color: "var(--muted)", fontSize: "11px"}}, [
          tdd("曲线"), tdd("水平%", 1), tdd("20日变动", 1), tdd("2017分位", 1), tdd("as of", 1),
        ])]),
        h("tbody", {}, cRows),
      ]);

      /* 事件时钟：自动（DATA.ficc.events）+ 人工（FICC_EVENTS）合并；src 徽标区分来源 */
      const srcColor = s => s === "LLM·待核" ? "#b07818" : s === "规则" ? "#8a8f98"
        : s === "人工" ? "#1f8a5f" : "#2563a8";
      const srcTip = s => s === "LLM·待核" ? "LLM 生成日期，建议人工核对官网日程" : "来源：" + s;
      const evAll = ((D.ficc && D.ficc.events) || [])
        .concat(FICC_EVENTS.map(e => Object.assign({}, e, {src: e.src || "人工"})))
        .filter(e => e && e.date && e.note)
        .sort((a, b) => a.date < b.date ? -1 : 1);
      const evDate = s => s.slice(5) + " 周" + "日一二三四五六"[new Date(s + "T00:00:00").getDay()];
      /* 窗口含 3 日回看（本周已过资金面事件有复盘参考）：过去日期整行灰显 + 「已发生」小标 */
      const _now = new Date();
      const todayStr = _now.getFullYear() + "-" + String(_now.getMonth() + 1).padStart(2, "0")
        + "-" + String(_now.getDate()).padStart(2, "0");
      const evRows = evAll.length
        ? evAll.map(e => {
            const past = e.date < todayStr;
            return h("tr", {style: past ? {opacity: "0.45"} : null}, [
            h("td", {style: {padding: "3px 10px", fontSize: "12px", whiteSpace: "nowrap"}},
              past ? [evDate(e.date), " ",
                h("span", {style: {fontSize: "10px", padding: "1px 5px", borderRadius: "8px",
                  background: "var(--bg-soft, #f5f6f8)", color: "#8a8f98", verticalAlign: "1px"}},
                  ["已发生"])] : [evDate(e.date)]),
            h("td", {style: {padding: "3px 10px", fontSize: "12px", whiteSpace: "nowrap"}}, [
              e.tag, " ",
              h("span", {style: {fontSize: "10px", padding: "1px 5px", borderRadius: "8px",
                background: "var(--bg-soft, #f5f6f8)", color: srcColor(e.src),
                cursor: "help", verticalAlign: "1px"}, title: srcTip(e.src || "日历")},
                [e.src || "日历"])]),
            tdd(e.note)])})

        : [h("tr", {}, [tdd("—"), tdd("待录入", 0, "var(--muted)"),
            tdd("未来 5 周关键日历事件（税期高峰、MLF/逆回购到期、跨月跨季、海外央行议息等），暂未录入")])];

      /* 深度链 chips */
      const link = (label, panel) => h("button", {class: "chip",
        onclick: () => App.show(panel)}, [label + " →"]);

      return h("section", {class: "card", id: "home-ficc-drive"}, [
        h("h3", {class: "card-title"}, ["利率债五驱动研判"]),
        App.badge("日频 · 规则化打分", R.as_of),
        h("p", {style: {fontSize: "12px", color: "var(--text)", background: "var(--bg-soft, #f5f6f8)",
          borderRadius: "6px", padding: "8px 12px", lineHeight: 1.8}}, [concl]),
        drvTable,
        h("div", {style: {display: "flex", flexWrap: "wrap", gap: "8px", margin: "12px 0"}}, scenCards),
        h("div", {class: "grid grid-2", style: {marginTop: "4px"}}, [
          h("div", {}, [
            h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
              ["曲线 11 档 · 水平 / 20日变动 / 2017 分位"]),
            curveTable,
          ]),
          h("div", {}, [
            h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
              ["事件时钟 · 近 3 日回看 + 未来 5 周前瞻（数据链自动 + 人工补充）"]),
            h("table", {style: {borderCollapse: "collapse"}}, [
              h("thead", {}, [h("tr", {style: {color: "var(--muted)", fontSize: "11px"}}, [
                tdd("日期"), tdd("事件"), tdd("关注点")])]),
              h("tbody", {}, evRows),
            ]),
            h("div", {style: {display: "flex", flexWrap: "wrap", gap: "6px", marginTop: "10px"}}, [
              link("资金面详情", "liquidity"), link("机构行为", "liquidity"),
              link("利差跟踪", "spread"), link("量化信号详情", "quant"), link("曲线凸点", "curve"),
            ]),
          ]),
        ]),
        h("p", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "10px", lineHeight: 1.6}}, [
          "方法：冻结数据契约 → 行情分段 → 预期诊断 → 五驱动打分 → 状态分类 → 事件时钟 → 价格与脆弱性(分位/carry) → 三情景 → 久期/曲线/杠杆落地。"
          + "打分与结论由页面数据实时推导（案例演示级）；事件时钟由数据链日更（资金面日历 / 买断到期排期 / 规则季节性 / LLM 议息·带确定性核查），LLM 条目请人工复核；不构成投资建议。"]),
      ]);
    }

    /* 组装后统一绘制（echarts.init 需容器已在文档中取到非零宽高） */
    root.append(Export.btn("home"));
    const fiveCard = cardFive();   // 五驱动卡：综合研判下方（无 rates 数据时跳过）
    root.append(
      anchorsCard,
      h("div", {class: "grid grid-2"}, [factorsCard, viewCard]),
      ...((fiveCard) ? [fiveCard] : []),
      h("div", {class: "grid grid-3"}, sumCards.map(c => c.card)),
    );
    sumCards.forEach(c => c.def.draw(c.box));
    if (narrative && narBody.scrollHeight > narBody.clientHeight + 4) expandBtn.style.display = "";
  },
};

<script>
/* ============================================================
   panels/quant.js — 量化模块（债券择时信号 + 信用三因子择券轮动）
   双卡只读展示：
     债券择时信号（本地近似·马尔可夫）：原理/使用说明 + 最新信号大字 + 四因子组状态chips
        + 信号vs中债财富指数对照图(◆=拐点) + 历史胜率统计 + 方法论脚注
     信用三因子择券轮动（均值回归·周频）：原理 + 最新持有组合/换仓指令 + top5候选
        + 三因子chips + 周频净值(策略@5bp vs 16曲线等权 vs 信用债指数参照)
        + 成本敏感性/绩效/分年表 + 方法论脚注
   消费：DATA.quant = {asOf, bondSignal:{...}, creditRotation:{latest,backtest,...}}、
        App.badge/fmt、h、Charts.custom
   ============================================================ */
PANELS["quant"] = {
  title: "量化信号",
  icon: "🧮",

  render(root) {
    const D = (typeof DATA !== "undefined" && DATA) || {};
    const Q = D.quant || {};
    const sig = Q.bondSignal || null;
    const cr = Q.creditRotation || null;
    const F = D.ficc || {};           // m_ficc.json（App.SECS quant→ficc 按需拉取）
    const fq = F.quant || null;       // 8191 子集集成（kind=quant_timing）

    /* —— 颜色：债券语境（跌=利好债券=绿，涨=利空债券=红）—— */
    const C_SIG = {"积极": "#1f8a5f", "中性": "#8a8f98", "风险": "#c24135"};
    const C_STATE = {"跌": "#1f8a5f", "涨": "#c24135", null: "#8a8f98"};

    const pct = (v, d) => (v === null || v === undefined || v === "" ? "—" :
      (Number(v) * 100).toFixed(d == null ? 2 : d) + "%");

    /* ============ 债券择时信号卡 ============ */
    function cardSignal() {
      const L = sig.latest || {};
      const hist = sig.history || [];
      const groups = L.groups || [];
      const bt = sig.backtest || null;

      /* —— 信号原理（卡顶）—— */
      const guide = h("div", {style: {border: "1px solid var(--border, #e3e5e8)", borderRadius: "6px",
        padding: "8px 12px", marginBottom: "12px", fontSize: "12px", lineHeight: 1.7,
        color: "var(--muted)", background: "var(--bg-soft, #f5f6f8)"}}, [
        h("div", {style: {fontWeight: 700, color: "var(--text, #222)", marginBottom: "2px"}},
          ["📖 信号原理与依据"]),
        h("div", {}, [h("b", {}, ["构造："]), "增长（制造业PMI）、通胀（CPI/PPI 同比均值）、货币（OMO 7天利率）"
          + " 三组基本面序列各自跑马尔可夫两状态模型，平滑概率>50% 判定该因子处于「涨 / 跌」区制。"]),
        h("div", {}, [h("b", {}, ["打分："]), "因子跌（经济走弱 / 资金利率降）= 利好债券 +1，因子涨 = 利空 -1 → "
          + "score ∈ -3..+3；≥+2 积极、≤-2 风险、其余中性；流动性（M1）仅参考不入分。"]),
        h("div", {}, [h("b", {}, ["依据："]), "基本面与资金利率同步下行的阶段，利率下行、债券总回报为正的概率更高；反之亦然。"]),
        h("div", {}, [h("b", {}, ["局限："]), "区制状态极持久，历史上多数月份停留在 ±1 中性区，"
          + "±2 阈值需三因子高度同向才触发。"]),
      ]);

      /* —— 最新信号大字 —— */
      const sigColor = C_SIG[L.signal] || "#8a8f98";
      const bigSig = h("div", {style: {display: "flex", alignItems: "baseline", gap: "14px",
        flexWrap: "wrap", padding: "10px 12px", borderRadius: "6px",
        background: "var(--bg-soft, #f5f6f8)", marginBottom: "12px"}}, [
        h("span", {style: {fontSize: "12px", color: "var(--muted)"}}, [L.month + " 最新信号"]),
        h("span", {style: {fontSize: "26px", fontWeight: 800, color: sigColor}}, [L.signal]),
        h("span", {style: {fontSize: "13px", color: "var(--muted)"}},
          ["打分 " + (L.score >= 0 ? "+" : "") + L.score + " / +3"]),
      ]);

      /* —— 如何使用 —— */
      const usage = h("div", {style: {border: "1px solid var(--border, #e3e5e8)", borderRadius: "6px",
        padding: "8px 12px", marginBottom: "12px", fontSize: "12px", lineHeight: 1.7,
        color: "var(--muted)"}}, [
        h("div", {style: {fontWeight: 700, color: "var(--text, #222)", marginBottom: "2px"}}, ["🧭 如何使用"]),
        h("div", {}, [
          h("span", {style: {fontWeight: 700, color: C_SIG["积极"]}}, ["积极（+2~+3）"]), " → 利好债券：拉长久期 / 超配；",
          h("span", {style: {fontWeight: 700, color: C_SIG["风险"]}}, ["风险（-2~-3）"]), " → 利空债券：缩短久期 / 降配；",
          h("span", {style: {fontWeight: 700, color: C_SIG["中性"]}}, ["中性（±1）"]), " → 方向不明：标配观望。",
        ]),
        h("div", {}, [h("b", {}, ["节奏："]), "月频信号，随每月 CPI/PPI 公布（次月 9-10 日）刷新；数据未出前沿用上月。"]),
        h("div", {}, [h("b", {}, ["定位："]), "中期方向参考（月度级别），不作短线择时；建议与资金面 / 机构行为模块互相验证。"]),
      ]);

      /* —— 四因子组状态 chips —— */
      const chips = groups.map(g => {
        const sc = C_STATE[g.state];
        return h("div", {style: {border: "1px solid var(--border, #e3e5e8)", borderRadius: "6px",
          padding: "8px 10px", minWidth: "150px", background: "var(--card, #fff)"}}, [
          h("div", {style: {display: "flex", justifyContent: "space-between", alignItems: "center"}}, [
            h("span", {style: {fontWeight: 600}}, [g.name]),
            h("span", {style: {fontSize: "15px", fontWeight: 700, color: sc}},
              [g.state || "—"]),
          ]),
          h("div", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "4px"}}, [
            g.series +
            (g.fallback ? " · 回退动量" : "") +
            (g.prob != null ? " · P(涨)=" + (g.prob * 100).toFixed(0) + "%" : ""),
          ]),
          h("div", {style: {fontSize: "12px", marginTop: "2px", fontVariantNumeric: "tabular-nums"}},
            ["最新读数 " + (g.last != null ? App.fmt(g.last, 2) : "—")]),
          h("div", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "2px"}},
            [g.contrib === null ? "参考·不入分" : "贡献 " + (g.contrib >= 0 ? "+" : "") + g.contrib]),
        ]);
      });
      const chipsRow = h("div", {style: {display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "12px"}}, chips);

      /* —— 信号 vs 中债财富指数 对照图（ECharts，挂载后绘制）—— */
      const chartBox = h("div", {style: {height: "250px", width: "100%"}});
      const drawOverlay = () => {
        const mo = (bt && bt.monthly) || [];
        if (!mo.length || !mo.some(x => x.i != null)) {
          chartBox.append(h("div", {class: "empty"}, ["暂无对照数据（需 assets.csv 中债财富指数）"]));
          return;
        }
        const marks = [];
        for (let i = 1; i < mo.length; i++) {
          if (mo[i].s !== mo[i - 1].s && mo[i].i != null) marks.push({
            coord: [mo[i].m, mo[i].i], symbol: "diamond", symbolSize: 11,
            itemStyle: {color: "#e6a23c"},
            label: {show: true, formatter: mo[i].m, position: "top", fontSize: 10, color: "#b07818"},
          });
        }
        Charts.custom(chartBox, {
          tooltip: {trigger: "axis", axisPointer: {type: "line"},
            formatter: ps => {
              const x = ps[0] && ps[0].axisValue;
              const row = mo.find(v => v.m === x);
              if (!row) return "";
              return [x,
                "指数 " + App.fmt(row.i, 1),
                "score " + (row.s >= 0 ? "+" : "") + row.s + "（" + row.g + "）",
                row.r == null ? null : "次月指数回报 " + (row.r >= 0 ? "+" : "") + Number(row.r).toFixed(2) + "%",
              ].filter(Boolean).join("<br>");
            }},
          legend: {data: ["中债财富指数", "信号score（右轴）"], bottom: 0, textStyle: {fontSize: 11}},
          grid: {top: 30, left: 8, right: 8, bottom: 26, containLabel: true},
          xAxis: {type: "category", data: mo.map(x => x.m), axisLabel: {fontSize: 10, hideOverlap: true}},
          yAxis: [
            {type: "value", name: "指数", scale: true, axisLabel: {fontSize: 10}},
            {type: "value", name: "score", min: -3.5, max: 3.5, interval: 1,
             axisLabel: {fontSize: 10}, splitLine: {show: false}},
          ],
          series: [
            {name: "中债财富指数", type: "line", data: mo.map(x => x.i), symbol: "none",
             lineStyle: {width: 2, color: "#3b6ea5"}, itemStyle: {color: "#3b6ea5"}, z: 3,
             markPoint: {data: marks, animation: false}},
            {name: "信号score（右轴）", type: "bar", yAxisIndex: 1, barWidth: "60%", z: 2,
             data: mo.map(x => ({value: x.s,
               itemStyle: {color: C_SIG[x.g] || "#8a8f98", opacity: x.g === "中性" ? 0.55 : 0.95}}))},
          ],
        });
      };
      const overlay = h("div", {}, [
        h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
          ["信号 vs 中债财富指数 · " + ((bt && bt.monthly) || []).length +
            " 月（柱=score·右轴，线=指数，◆=拐点）"]),
        chartBox,
      ]);

      /* —— 历史胜率统计 —— */
      let winrate = null;
      if (bt && bt.n) {
        const pos = bt.pos || {}, neg = bt.neg || {};
        const cell = (label, val, sub, color) => h("div", {style: {
          border: "1px solid var(--border, #e3e5e8)", borderRadius: "6px", padding: "8px 10px",
          minWidth: "160px", background: "var(--card, #fff)", textAlign: "center"}}, [
          h("div", {style: {fontSize: "11px", color: "var(--muted)"}}, [label]),
          h("div", {style: {fontSize: "20px", fontWeight: 800,
            color: color || "var(--text, #222)", fontVariantNumeric: "tabular-nums"}}, [val]),
          h("div", {style: {fontSize: "11px", color: "var(--muted)"}}, [sub]),
        ]);
        const negHit = neg.upRate != null ? (1 - neg.upRate) : null;
        winrate = h("div", {style: {marginTop: "12px"}}, [
          h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
            ["历史胜率 · 基准 " + (bt.benchmark || "中债财富指数") + "（次月总回报）"]),
          h("div", {style: {display: "flex", flexWrap: "wrap", gap: "8px"}}, [
            cell("方向综合命中", (bt.hitRate * 100).toFixed(1) + "%", "n=" + bt.n + " 月"),
            cell("偏多月(score>0) 次月上涨", pos.upRate != null ? (pos.upRate * 100).toFixed(1) + "%" : "—",
              "n=" + (pos.n || 0) + " · 月均 +" + (pos.avg != null ? pos.avg.toFixed(2) : "—") + "%",
              "#1f8a5f"),
            cell("偏空月(score<0) 次月下跌", negHit != null ? (negHit * 100).toFixed(1) + "%" : "—",
              "n=" + (neg.n || 0) + " · 月均 +" + (neg.avg != null ? neg.avg.toFixed(2) : "—") + "%",
              "#c24135"),
          ]),
          h("div", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "6px", lineHeight: 1.6}}, [
            "积极 / 风险 历史样本仅 " + ((hist.filter(x => x.signal === "积极").length) || 0) + " / " +
            ((hist.filter(x => x.signal === "风险").length) || 0) + " 月，信号级胜率无统计意义；" +
            "偏空月债券仍多数上涨（2012-15 利率下行长周期），score 宜作相对强弱参考而非做空依据。",
          ]),
        ]);
      }

      /* —— 信号分布 —— */
      const dist = {};
      hist.forEach(hm => { dist[hm.signal] = (dist[hm.signal] || 0) + 1; });
      const distTxt = ["积极", "中性", "风险"].map(s =>
        (dist[s] || 0) + " " + s).join(" · ");

      return {
        card: h("section", {class: "card", id: "quant-signal"}, [
          h("h3", {class: "card-title"}, ["债券择时信号 · 马尔可夫"]),
          App.badge("本地近似 · 非官方口径", sig.asOf),
          guide,
          bigSig,
          usage,
          chipsRow,
          overlay,
          ...(winrate ? [winrate] : []),
          h("p", {style: {fontSize: "11px", color: "var(--muted)", marginTop: "10px", lineHeight: 1.6}}, [
            sig.method || "",
            "；窗口 " + (sig.window || "?") + "（" + (sig.nMonths || 0) + " 月）；历史分布 " + distTxt + "。",
            " 三因子各 ±1（parity → score∈{−3,−1,+1,+3}），±2 阈值实需三因子高度同向。",
          ]),
        ]),
        draw: drawOverlay,
      };
    }

    /* ============ 信用债三因子择券轮动卡 ============ */
    function cardCredit() {
      const L = cr.latest || {};
      const bt = cr.backtest || {};
      const at5 = bt.at5bp || {};
      const cs = bt.costSensitivity || {};
      const ann = bt.annual || [];
      const nav = bt.nav || [];

      /* —— 策略原理（卡顶）—— */
      const guide = h("div", {style: {border: "1px solid var(--border, #e3e5e8)", borderRadius: "6px",
        padding: "8px 12px", marginBottom: "12px", fontSize: "12px", lineHeight: 1.7,
        color: "var(--muted)", background: "var(--bg-soft, #f5f6f8)"}}, [
        h("div", {style: {fontWeight: 700, color: "var(--text, #222)", marginBottom: "2px"}},
          ["📖 策略原理与依据"]),
        h("div", {}, [h("b", {}, ["三因子："]), "期限因子（各品种 3Y−1Y / 5Y−3Y / 7Y−5Y 段期限利差）、"

            formatter: v => (v * 100).toFixed(0) + "%"}},
          series: [
            {name: "跟随信号调久期", type: "line", data: S.curve_durmap || [], symbol: "none",
             lineStyle: {width: 2, color: "#1f8a5f"}, itemStyle: {color: "#1f8a5f"}},
            {name: "固定久期5（对照）", type: "line", data: S.curve_bh || [], symbol: "none",
             lineStyle: {width: 1.5, color: "#8a8f98", type: "dashed"}, itemStyle: {color: "#8a8f98"}},
            {name: "固定久期4（对照）", type: "line", data: S.curve_dur4 || [], symbol: "none",
             lineStyle: {width: 1.5, color: "#b07818", type: "dotted"}, itemStyle: {color: "#b07818"}},
          ],
        });
      };
      const dmBlock = h("div", {}, [
        h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
          ["按信号调久期的累计回报 vs 固定久期（含票息收益）"]),
        dmBox,
      ]);

      /* —— 预测台账（近14月） —— */
      const td = (t, right) => h("td", {style: {padding: "2px 10px",
        textAlign: right ? "right" : "left", fontVariantNumeric: "tabular-nums"}}, [t]);
      const ledgerRows = monthly.slice(-14).slice().reverse().map(x => h("tr", {}, [
        td(x.month),
        td((Number(x.p_median) * 100).toFixed(1) + "%", 1),
        td(x.signal ? "上行" : "下行", 1),
        td(x.realized == null ? "—" : (x.realized ? "上行" : "下行"), 1),
        td(x.realized == null ? "—" : (x.signal === x.realized ? "✓" : "✗"), 1),
        td(bpS(x.y_next), 1),
      ]));
      const ledger = h("div", {style: {marginTop: "12px"}}, [
        h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
          ["每月预测记录 · 近 14 月（预测 vs 实际走势）"]),
        h("table", {style: {borderCollapse: "collapse", fontSize: "12px"}}, [
          h("thead", {}, [h("tr", {style: {color: "var(--muted)", fontSize: "11px"}}, [
            td("月份"), td("上行概率", 1), td("预测", 1), td("实际", 1), td("对错", 1), td("次月利率变动", 1),
          ])]),
          h("tbody", {}, ledgerRows),
        ]),
      ]);

      /* —— 分年命中率 chips —— */
      const yh = S.yearly_hit || {};
      const yCells = Object.keys(yh).sort().map(y => {
        const v = yh[y];
        return h("span", {style: {display: "inline-block", border: "1px solid var(--border, #e3e5e8)",
          borderRadius: "5px", padding: "2px 7px", fontSize: "11px",
          fontVariantNumeric: "tabular-nums",
          color: v >= 0.6 ? "#1f8a5f" : v <= 0.45 ? "#c24135" : "var(--muted)"}}, [
          y + " " + (v * 100).toFixed(0) + "%"]);
      });
      const yearly = h("div", {style: {marginTop: "12px"}}, [
        h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
          ["分年预测准确率（趋势明朗的年份通常更准）"]),
        h("div", {style: {display: "flex", flexWrap: "wrap", gap: "6px"}}, yCells),
      ]);

      /* —— Top 子集（前12） —— */
      const topRows = (fq.top_subsets || []).slice(0, 12).map((t, i) => h("tr", {}, [
        td(String(i + 1)),
        td(Number(t.hit_in * 100).toFixed(1) + "%", 1),
        td((Number(t.p) * 100).toFixed(1) + "%", 1),
        td(t.vars),
      ]));
      const topTable = h("div", {style: {marginTop: "12px"}}, [
        h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
          ["表现最好的 12 个因子组合（按训练期准确率 · 仅供参考，非样本外成绩）"]),
        h("table", {style: {borderCollapse: "collapse", fontSize: "11px"}}, [
          h("thead", {}, [h("tr", {style: {color: "var(--muted)", fontSize: "11px"}}, [
            td("#"), td("训练期准确率", 1), td("当前概率", 1), td("因子组合"),
          ])]),
          h("tbody", {}, topRows),
        ]),
      ]);

      /* —— 因子快照 now vs 12个月前 —— */
      const fn = fq.factor_now || {}, fp = fq.factor_prev || {};
      const fRows = (spec.factors || []).filter(n => n in fn).map(n => h("tr", {}, [
        td(n), td(fn[n] == null ? "—" : App.fmt(fn[n], 2), 1),
        td(fp[n] == null ? "—" : App.fmt(fp[n], 2), 1),
        td(fn[n] == null || fp[n] == null ? "—" :
          ((fn[n] - fp[n] > 0 ? "+" : "") + Number(fn[n] - fp[n]).toFixed(2)), 1),
      ]));
      const fTable = h("div", {style: {marginTop: "12px"}}, [
        h("div", {style: {fontSize: "13px", fontWeight: 600, color: "var(--muted)", margin: "4px 0 6px"}},
          ["因子现状 · 最新 vs 一年前（宏观指标取上月末值）"]),
        h("table", {style: {borderCollapse: "collapse", fontSize: "12px"}}, [
          h("thead", {}, [h("tr", {style: {color: "var(--muted)", fontSize: "11px"}}, [
            td("因子"), td("最新", 1), td("一年前", 1), td("Δ", 1),
          ])]),
          h("tbody", {}, fRows),
        ]),
      ]);

      /* —— 声明卡 —— */
      const simpl = (spec.simplifications || []);
      const decl = h("div", {style: {border: "1px solid #f0d9a8", borderRadius: "6px",
        padding: "8px 12px", marginTop: "12px", fontSize: "11px", lineHeight: 1.7,
        color: "var(--muted)", background: "var(--bg-soft, #faf7f0)"}}, [
        h("div", {style: {fontWeight: 700, color: "#b07818", marginBottom: "2px"}},
          ["⚠ 方法论声明（" + (spec.target || "10Y国开下月方向") + "）"]),
        ...simpl.map(t => h("div", {}, ["· " + t])),
        h("div", {}, ["· 本卡与「马尔可夫」tab 方法相互独立（本卡=多因子小模型投票，马尔可夫=市场状态切换模型），两者结论一致不构成独立证据。"]),
      ]);

      return {
        card: h("section", {class: "card", id: "quant-ficc8191"}, [
          h("h3", {class: "card-title"}, ["量化利率择时 · 多因子模型投票"]),
          App.badge("月频 · 本地重算", fq.asOf),
          h("p", {style: {fontSize: "12px", color: "var(--muted)", lineHeight: 1.7}}, [
            "用 13 个宏观、资金、估值因子两两组合成 8191 个小模型；每月用近 5 年历史训练（宏观指标滞后 1 月，只用当时已知的数据），"
            + "预测下月 10Y 利率上行概率，取全部小模型概率的中间值作为综合信号。概率 <50% 偏多债市（预期利率下行），并按概率高低把组合久期在 2~6 年间调整。"]),
          kpis,
          pmBlock,
          dmBlock,
          h("div", {class: "grid grid-2"}, [ledger, topTable]),
          yearly,
          fTable,
          decl,
        ]),
        draw: () => { drawPm(); drawDm(); },
      };
    }

    /* —— 挂载：子 tab（多因子投票 → 马尔可夫 → 信用三因子），懒构建 + 切回重画 —— */
    root.append(Export.btn("quant"));
    if (!sig && !cr && !fq) {
      root.append(h("section", {class: "card"}, [
        h("div", {class: "empty"}, ["暂无量化信号——跑 python scripts/update.py --only quant 并 build 刷新"]),
      ]));
      return;
    }
    const SUBTABS = [
      ...(fq ? [{label: "多因子投票", build: card8191}] : []),
      ...(sig ? [{label: "马尔可夫", build: cardSignal}] : []),
      ...(cr ? [{label: "信用三因子", build: cardCredit}] : []),
    ];
    const tabBtnStyle = on => ({border: "1px solid " + (on ? "var(--blue)" : "var(--border, #e3e5e8)"),
      background: on ? "var(--blue)" : "var(--card, #fff)", color: on ? "#fff" : "var(--muted)",
      borderRadius: "14px", padding: "4px 14px", fontSize: "12px", cursor: "pointer"});
    const slots = SUBTABS.map(() => h("div", {style: {display: "none"}}, []));
    const btns = SUBTABS.map((t, i) => h("button", {style: tabBtnStyle(i === 0)}, [t.label]));
    const built = [];
    const showTab = i => {
      btns.forEach((b, j) => Object.assign(b.style, tabBtnStyle(j === i)));
      slots.forEach((s, j) => s.style.display = j === i ? "" : "none");
      if (!built[i]) {                   // 懒构建：容器可见后才 build+draw（echarts 需非零宽高）
        built[i] = SUBTABS[i].build();
        slots[i].append(built[i].card);
      }
      built[i].draw();                  // 切回重画：charts.custom 同 el 先 dispose，幂等
    };
    btns.forEach((b, i) => b.addEventListener("click", () => showTab(i)));
    root.append(h("div", {style: {display: "flex", gap: "8px", marginBottom: "14px", flexWrap: "wrap"}}, btns));
    slots.forEach(s => root.append(s));
    showTab(0);
  },
};
</script>
<script>
/* ============================================================
   panels/curve.js — 曲线凸点（信用债主体曲线 + 利率债曲线 + 凸点检测/挖掘）
   每个主体/品种一个卡片：曲线图 + 凸点信号表
   消费：DATA.curve = {asOf, issuers:[...], rateCurves:[...]}
   ============================================================ */
PANELS["curve"] = {
  title: "曲线凸点",
  icon: "〰️",

  render(root) {
    const D = (typeof DATA !== "undefined" && DATA) || {};
    const C = D.curve || {};
    const issuers = Array.isArray(C.issuers) ? C.issuers : [];
    const rateCurves = Array.isArray(C.rateCurves) ? C.rateCurves : [];
    const asOf = C.asOf || "";

    /* 解读说明 */
    const guideCard = h("section", {class: "card", style: {fontSize: "13px", lineHeight: "1.7"}}, [
      h("h3", {class: "card-title"}, ["📖 如何看曲线凸点"]),
      h("div", {}, [
        h("p", {}, [h("b", {}, ["横轴 = 剩余期限（年，整数刻度）"]), "，纵轴 = 到期收益率（%）"]),
        h("p", {}, [h("span", {style: {color: "#ef4444", fontWeight: 600}}, ["● 凸点（红色◆）"]),
          "：曲线向上弯曲 → 该期限收益率", h("b", {}, ["高于"]), "曲线平滑预期 → ",
          h("b", {style: {color: "#16a34a"}}, ["买入信号（收益率偏贵）"])]),
        h("p", {}, [h("span", {style: {color: "#3b82f6", fontWeight: 600}}, ["● 凹点（蓝色◆）"]),
          "：曲线向下弯曲 → 该期限收益率", h("b", {}, ["低于"]), "预期 → ",
          h("b", {style: {color: "#dc2626"}}, ["避免或卖出（收益率偏便宜）"])]),
        h("p", {}, ["z-score 衡量偏离程度：", h("b", {}, ["强≥2.5"]), " / 中≥2.0 / 弱≥1.5",
          "。实操：找", h("span", {style: {color: "#ef4444"}}, ["凸点"]), "附近个券买入，获取相对同主体其他期限的超额收益。"]),
      ]),
    ]);

    /* 信用债/利率债 tab */
    const tabCredit = h("button", {class: "tab active", onclick: () => showSection("credit")}, ["信用债曲线"]);
    const tabRate = h("button", {class: "tab", onclick: () => showSection("rate")}, ["利率债曲线"]);
    const sectionBox = h("div", {id: "curve-section", style: {marginTop: "10px"}});

    function showSection(section) {
      tabCredit.classList.toggle("active", section === "credit");
      tabRate.classList.toggle("active", section === "rate");
      sectionBox.innerHTML = "";
      if (section === "credit") drawCreditSection();
      else drawRateSection();
    }

    /* ── 信用债：主体 tab + 曲线图 + 凸点表 ── */
    function drawCreditSection() {
      if (!issuers.length) {
        sectionBox.append(h("div", {class: "empty"}, ["暂无信用债曲线数据——运行 python scripts/update.py --only curve 刷新"]));
        return;
      }
      const tabs = h("div", {class: "tabs", style: {flexWrap: "wrap", gap: "4px"}});
      const contentBox = h("div", {style: {marginTop: "10px"}});
      issuers.forEach((iss, i) => {
        const shortName = iss.name.length > 8 ? iss.name.slice(0, 8) + "…" : iss.name;
        tabs.append(h("button", {
          class: "tab" + (i === 0 ? " active" : ""),
          "data-i": i, title: iss.name,
          onclick: () => { tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", +t.dataset.i === i)); drawIssuer(i); },
        }, [shortName]));
      });
      sectionBox.append(h("section", {class: "card"}, [
        h("h3", {class: "card-title"}, ["信用债主体曲线"]),
        App.badge(`${issuers.length}个主体`, asOf),
        h("p", {class: "card-sub"}, ["点击主体标签切换 · 曲线由个券估值Hermite插值 · 凸/凹点由二阶差分z-score检测"]),
        tabs,
      ]));
      sectionBox.append(contentBox);

      function drawIssuer(idx) {
        contentBox.innerHTML = "";
        const iss = issuers[idx];
        if (!iss) return;
        const curve = iss.curve || {};
        const rawPts = iss.rawPoints || [];
        const convex = iss.convexPoints || [];

        const chartBox = h("div", {class: "chart", style: {height: "380px"}});
        const curveCard = h("section", {class: "card"}, [
          h("h3", {class: "card-title"}, [iss.name + " 信用债曲线"]),
          App.badge(`${iss.bondCount}支券 · ${curve.method || "hermite"} · 最长${iss.maxTenor}Y`, asOf),
          iss.error ? h("div", {class: "empty"}, [iss.error]) : null,
        ]);

        const convexBox = h("div");
        const convexCard = h("section", {class: "card"}, [
          h("h3", {class: "card-title"}, ["凸点/凹点信号"]),
          h("p", {class: "card-sub"}, ["红色◆=凸点（买入信号）蓝色◆=凹点（避免/卖出信号）"]),
        ]);

        contentBox.append(curveCard, convexCard);

        /* 绘制曲线 */
        const series = [];
        if (curve.tenors && curve.tenors.length && curve.yields && curve.yields.length) {
          series.push({name: "收益率曲线", tenors: curve.tenors, yields: curve.yields,
            lineStyle: {width: 2}});
        }
        if (rawPts.length) {
          series.push({name: "个券估值", tenors: rawPts.map(p => p.tenor), yields: rawPts.map(p => p.yield),
            symbolSize: 6, itemStyle: {color: "#6b7280"}, lineStyle: {width: 0}});
        }
        // 拆分凸点(红)和凹点(蓝)为两个series，确保小数期限也能渲染
        const convexPts = convex.filter(c => c.direction === "凸");
        const concavePts = convex.filter(c => c.direction === "凹");
        if (convexPts.length) {
          series.push({name: "凸点", tenors: convexPts.map(c => c.tenor), yields: convexPts.map(c => c.yield),
            symbolSize: 14, symbol: "diamond",
            itemStyle: {color: "#ef4444"}, lineStyle: {width: 0}});
        }
        if (concavePts.length) {
          series.push({name: "凹点", tenors: concavePts.map(c => c.tenor), yields: concavePts.map(c => c.yield),
            symbolSize: 14, symbol: "diamond",
            itemStyle: {color: "#3b82f6"}, lineStyle: {width: 0}});
        }

        if (series.length) {
          curveCard.append(chartBox);
          drawTenorChart(chartBox, series, iss.maxTenor);
        } else {
          curveCard.append(h("div", {class: "empty"}, ["曲线数据不足"]));
        }

        /* 凸点表 */
        if (convex.length) {
          convexCard.append(convexBox);
          const COLOR_C = {"凸": "#ef4444", "凹": "#3b82f6"};
          convexBox.append(h("table", {class: "tbl"}, [
            h("thead", {}, [h("tr", {},
              ["期限(Y)", "收益率(%)", "二阶导", "z-Score", "方向", "强度", "附近个券"]
                .map(t => h("th", {}, [t])))]),
            h("tbody", {}, convex.map(p => h("tr", {}, [
              h("td", {}, [App.fmt(p.tenor, 2)]),
              h("td", {}, [App.fmt(p.yield, 4)]),
              h("td", {}, [App.fmt(p.secondDeriv, 4)]),
              h("td", {style: {fontWeight: 600}}, [App.fmt(p.zScore, 2)]),
              h("td", {}, [h("span", {style: {color: COLOR_C[p.direction] || "#8a8f98", fontWeight: 600}}, [p.direction])]),
              h("td", {}, [p.strength]),
              h("td", {style: {fontSize: "12px"}}, [(p.nearbyBonds || []).join(", ") || "—"]),
            ])))]));
        } else {
          convexCard.append(h("div", {class: "empty"}, ["无显著凸/凹点"]));
        }
      }
      drawIssuer(0);
    }

    /* ── 利率债曲线 ── */
    function drawRateSection() {
      if (!rateCurves.length) {
        sectionBox.append(h("div", {class: "empty"}, ["利率债曲线待构建（国债/国开/口行/农发）"]));
        return;
      }
      // 类似信用债渲染逻辑
      const tabs = h("div", {class: "tabs", style: {flexWrap: "wrap", gap: "4px"}});
      const contentBox = h("div", {style: {marginTop: "10px"}});
      rateCurves.forEach((rc, i) => {
        tabs.append(h("button", {
          class: "tab" + (i === 0 ? " active" : ""),
          "data-i": i, title: rc.name,
          onclick: () => { tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", +t.dataset.i === i)); drawRate(i); },
        }, [rc.name]));
      });
      sectionBox.append(h("section", {class: "card"}, [
        h("h3", {class: "card-title"}, ["利率债曲线"]),
        App.badge(`${rateCurves.length}个品种`, asOf),
        tabs,
      ]));
      sectionBox.append(contentBox);

      function drawRate(idx) {
        contentBox.innerHTML = "";
        const rc = rateCurves[idx];
        if (!rc) return;
        const curve = rc.curve || {};
        const convex = rc.convexPoints || [];
        const chartBox = h("div", {class: "chart", style: {height: "380px"}});
        const card = h("section", {class: "card"}, [
          h("h3", {class: "card-title"}, [rc.name + " 收益率曲线"]),
          App.badge(curve.method || "hermite", asOf),
        ]);
        contentBox.append(card);

        const series = [];
        if (curve.tenors && curve.yields) {
          series.push({name: "收益率曲线", tenors: curve.tenors, yields: curve.yields, lineStyle: {width: 2}});
        }
        // 拆分凸点(红)和凹点(蓝)
        const convexPts = convex.filter(c => c.direction === "凸");
        const concavePts = convex.filter(c => c.direction === "凹");
        if (convexPts.length) {
          series.push({name: "凸点", tenors: convexPts.map(c => c.tenor), yields: convexPts.map(c => c.yield),
            symbolSize: 14, symbol: "diamond", itemStyle: {color: "#ef4444"}, lineStyle: {width: 0}});
        }
        if (concavePts.length) {
          series.push({name: "凹点", tenors: concavePts.map(c => c.tenor), yields: concavePts.map(c => c.yield),
            symbolSize: 14, symbol: "diamond", itemStyle: {color: "#3b82f6"}, lineStyle: {width: 0}});
        }
        if (series.length) { card.append(chartBox); drawTenorChart(chartBox, series, Math.ceil(Math.max(...(curve.tenors || [10])))); }
        else { card.append(h("div", {class: "empty"}, ["曲线数据不足"])); }

        if (convex.length) {
          const COLOR_C = {"凸": "#ef4444", "凹": "#3b82f6"};
          contentBox.append(h("section", {class: "card"}, [
            h("h3", {class: "card-title"}, ["凸点/凹点信号"]),
            h("table", {class: "tbl"}, [
              h("thead", {}, [h("tr", {}, ["期限(Y)", "收益率(%)", "z-Score", "方向", "强度"].map(t => h("th", {}, [t])))]),
              h("tbody", {}, convex.map(p => h("tr", {}, [
                h("td", {}, [App.fmt(p.tenor, 2)]), h("td", {}, [App.fmt(p.yield, 4)]),
                h("td", {style: {fontWeight: 600}}, [App.fmt(p.zScore, 2)]),
                h("td", {}, [h("span", {style: {color: COLOR_C[p.direction] || "#8a8f98", fontWeight: 600}}, [p.direction])]),
                h("td", {}, [p.strength]),
              ])))]),
          ]));
        }
      }
      drawRate(0);
    }

    /* ── 共用：期限x轴echarts渲染（整数刻度） ── */
    function drawTenorChart(box, series, maxTenor) {
      const maxT = Math.ceil(maxTenor || 10);
      const xTicks = Array.from({length: maxT + 1}, (_, i) => i);
      const opts = {
        tooltip: {trigger: 'axis', axisPointer: {type: 'cross'},
          formatter: params => params.map(p => `${p.seriesName}: ${Number(p.axisValue).toFixed(1)}Y → ${App.fmt(Array.isArray(p.value) ? p.value[1] : p.value, 4)}%`).join('<br>')},
        legend: {data: series.map(s => s.name), bottom: 0, type: 'scroll'},
        grid: {top: 34, left: 50, right: 20, bottom: 40},
        xAxis: {type: 'value', name: '剩余期限(Y)', min: 0, max: maxT,
                interval: maxT <= 10 ? 1 : maxT <= 20 ? 2 : 5,
                axisLabel: {fontSize: 11}, splitLine: {show: true, lineStyle: {type: 'dashed', opacity: 0.3}}},
        yAxis: {type: 'value', name: '%', axisLabel: {fontSize: 11},
                scale: true},
        series: series.map((s, i) => ({
          name: s.name, type: 'line',
          data: s.tenors.map((t, j) => [t, s.yields[j]]),
          symbolSize: s.symbolSize || (i === 0 ? 0 : 4),
          lineStyle: s.lineStyle || {width: 2},
          itemStyle: s.itemStyle || {},
          symbol: s.symbol || 'circle',
          smooth: i === 0 ? 0.2 : false,
          connectNulls: true,
        })),
      };
      return Charts.custom(box, opts);
    }

    root.append(Export.btn("curve"));
    root.append(guideCard);
    root.append(h("div", {style: {display: "flex", gap: "8px", marginBottom: "8px"}}, [tabCredit, tabRate]));
    root.append(sectionBox);
    showSection("credit");
  },
};
</script>
