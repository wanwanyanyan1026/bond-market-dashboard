  var DX22 = (816.4 - 90) / (D.p22.dates.length - 1);
  var PANELS = [
    {svg: 'svg-p18', x0: 60, x1: 810, y0: 185, y1: 375, n: D.p18.dates.length, dx: DX18, dates: D.p18.dates, rows: [
      {name: '融资端高频指数', color: '#C23B22', vals: D.p18.index, yof: function (v) { return 375 - v * 1.9; }, fmt: function (v) { return v.toFixed(1); }, nullText: '1 月无读数'}
    ]},
    {svg: 'svg-p18', x0: 60, x1: 810, y0: 428, y1: 596, n: D.p18.dates.length, dx: DX18, dates: D.p18.dates, rows: [
      {name: '政府债净融资 Z', color: '#16345C', vals: D.p18.z.gov_net, yof: function (v) { return 531.4 - v * 32.3; }, fmt: function (v) { return (v >= 0 ? '+' : '') + v.toFixed(2); }, nullText: '—'},
      {name: '新增专项债 Z', color: '#1E7B4F', vals: D.p18.z.special, yof: function (v) { return 531.4 - v * 32.3; }, fmt: function (v) { return (v >= 0 ? '+' : '') + v.toFixed(2); }, nullText: '—'},
      {name: '国债净融资 Z', color: '#4A7BB5', vals: D.p18.z.treasury, yof: function (v) { return 531.4 - v * 32.3; }, fmt: function (v) { return (v >= 0 ? '+' : '') + v.toFixed(2); }, nullText: '—'},
      {name: '新增债进度 Z', color: '#5A6572', vals: D.p18.z.progress, yof: function (v) { return 531.4 - v * 32.3; }, fmt: function (v) { return (v >= 0 ? '+' : '') + v.toFixed(2); }, nullText: '—'}
    ]},
    {svg: 'svg-p21', x0: 60, x1: 830, y0: 190, y1: 580, n: D.p21.dates.length, dx: DX21, dates: D.p21.dates, rows: [
      {name: '综合指数', color: '#16345C', vals: D.p21.index, yof: function (v) { return 580 - v * 3.9; }, fmt: function (v) { return v.toFixed(1); }},
      {name: 'DR007 %', color: '#C23B22', vals: D.p21.dr007, yof: function (v) { return 580.5 - (v - 1) / 1.5 * 366; }, fmt: function (v) { return v.toFixed(2) + '%'; }},
      {name: 'OMO 7D %', color: '#8A93A0', vals: null, omo: true, yof: function (v) { return 580.5 - (v - 1) / 1.5 * 366; }, fmt: function (v) { return v.toFixed(2) + '%'; }}
    ]},
    {svg: 'svg-p22', x0: 90, x1: 823, y0: 195, y1: 585, n: D.p22.dates.length, dx: DX22, dates: D.p22.dates, quads: D.p22.quads, rows: [
      {name: '信用周期指数', color: '#16345C', vals: D.p22.credit, yof: function (v) { return 473.6 - v * 11.1429; }, fmt: function (v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }, nullText: '—'},
      {name: '流动性指数', color: '#27AE60', vals: D.p22.liq, yof: function (v) { return 401.5 - (v - 50) * 4.6019; }, fmt: function (v) { return v.toFixed(1); }}
    ]}
  ];
  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  PANELS.forEach(function (p) {
    var svg = document.getElementById(p.svg);
    if (!svg) return;
    var slide = svg.parentNode;
    var tip = slide.querySelector('.tip');
    var dx = p.dx;  /* 与 Python X18/X21/X22 步长一致，避免悬停错位 */
    var cross = el('line', {x1: 0, y1: p.y0, x2: 0, y2: p.y1, stroke: '#8A93A0', 'stroke-width': 1, 'stroke-dasharray': '3,3', opacity: 0.65, visibility: 'hidden'});
    svg.appendChild(cross);
    var marks = p.rows.map(function () {
      var c = el('circle', {r: 3.4, fill: '#FFFFFF', stroke: '#16345C', 'stroke-width': 1.6, visibility: 'hidden'});
      svg.appendChild(c);
      return c;
    });
    var overlay = el('rect', {x: p.x0, y: p.y0, width: p.x1 - p.x0, height: p.y1 - p.y0, fill: 'transparent', style: 'cursor:crosshair'});
    svg.appendChild(overlay);
    function quadAt(i) {
      if (!p.quads) return null;
      for (var k = 0; k < p.quads.length; k++) if (i >= p.quads[k][0] && i < p.quads[k][1]) return p.quads[k][2];
      return p.quads.length ? p.quads[p.quads.length - 1][2] : null;
    }
    function render(i) {
      var x = p.x0 + i * dx;
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);
      cross.setAttribute('visibility', 'visible');
      var html = '<div class="d">' + p.dates[i] + '</div>';
      p.rows.forEach(function (r, k) {
        var v = r.omo ? omoAt(D.p21.omo, i) : r.vals[i];
        if (v == null) {
          marks[k].setAttribute('visibility', 'hidden');
        } else {
          marks[k].setAttribute('cx', x); marks[k].setAttribute('cy', r.yof(v));
          marks[k].setAttribute('stroke', r.color);
          marks[k].setAttribute('visibility', 'visible');
        }
        var txt = (v == null) ? (r.nullText || '—') : r.fmt(v);
        html += '<div class="r"><span class="sw" style="background:' + r.color + '"></span>' + r.name + '<span class="v">' + txt + '</span></div>';
      });
      var q = quadAt(i);
      if (q) html += '<div class="r"><span class="sw" style="background:' + QCOL[q] + '"></span>象限 ' + QNAME[q] + '</div>';
      tip.innerHTML = html;
      tip.style.opacity = 1;
      var sw = svg.clientWidth, sh = svg.clientHeight;
      var left = x / 1280 * sw, top = (p.y0 + 10) / 720 * sh;
      var half = tip.offsetWidth / 2 + 4;
      left = Math.max(half, Math.min(left, sw - half));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    }
    overlay.addEventListener('mousemove', function (e) {
      var r = overlay.getBoundingClientRect();
      var xv = (e.clientX - r.left) / r.width * (p.x1 - p.x0) + p.x0;
      var i = Math.max(0, Math.min(p.n - 1, Math.round((xv - p.x0) / dx)));
      render(i);
    });
    overlay.addEventListener('mouseleave', function () {
      cross.setAttribute('visibility', 'hidden');
      marks.forEach(function (m) { m.setAttribute('visibility', 'hidden'); });
      tip.style.opacity = 0;
    });
  });
})();
</script>
</body>
</html>
